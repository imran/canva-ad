<svg xmlns="http://www.w3.org/2000/svg" width="1254" height="1254" viewBox="0 0 1254 1254" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#26155C"/>
      <stop offset="40%" stop-color="#3E1D5E"/>
      <stop offset="68%" stop-color="#8E2E69"/>
      <stop offset="88%" stop-color="#CC3F70"/>
      <stop offset="100%" stop-color="#E74772"/>
    </linearGradient>
    <radialGradient id="glow" cx="80%" cy="82%" r="62%">
      <stop offset="0%" stop-color="#F2607F" stop-opacity="0.40"/>
      <stop offset="60%" stop-color="#F0567E" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#F0567E" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="logoMark" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2E9CC4"/>
      <stop offset="100%" stop-color="#3FB9D6"/>
    </linearGradient>
  </defs>
  <rect width="1254" height="1254" fill="url(#bg)"/>
  <rect width="1254" height="1254" fill="url(#glow)"/>
  <g fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="2">
    <circle cx="1135" cy="995" r="150"/>
    <circle cx="1135" cy="995" r="295"/>
    <circle cx="1135" cy="995" r="445"/>
    <circle cx="1135" cy="995" r="600"/>
    <circle cx="1135" cy="995" r="760"/>
  </g>

  <!-- Logo mark: concentric radar arcs spiralling into a small hook -->
  <g transform="translate(108 142)" fill="none" stroke="url(#logoMark)" stroke-linecap="round">
    <path d="M -34 16 A 38 38 0 1 1 30 24" stroke-width="7"/>
    <path d="M -22 14 A 25 25 0 1 1 20 18" stroke-width="6.5"/>
    <path d="M -11 11 A 13 13 0 1 1 11 9" stroke-width="6"/>
  </g>
  <circle cx="108" cy="142" r="6.5" fill="#2E9CC4"/>

  <text x="160" y="125" font-size="62" font-weight="700" fill="#FFFFFF" letter-spacing="-1">radar</text>
  <text x="161" y="170" font-size="40" font-weight="400" fill="#2E9CC4" letter-spacing="2">healthcare</text>

  <text x="138" y="355" font-size="72" font-weight="700" fill="#FFFFFF">Nearly</text>
  <text x="128" y="600" font-size="290" font-weight="800" fill="#FFFFFF" letter-spacing="-6">£460m</text>
  <text x="138" y="688" font-size="50" font-weight="700" fill="#FFFFFF">paid in consent-related</text>
  <text x="138" y="756" font-size="50" font-weight="700" fill="#FFFFFF">healthcare claims between 2019-2025*</text>
  <rect x="136" y="813" width="164" height="6" rx="3" fill="#F5B82E"/>
  <text x="138" y="912" font-size="44" font-weight="400" fill="#EDE7F2">Discover how Digital Consent</text>
  <text x="138" y="970" font-size="44" font-weight="400" fill="#EDE7F2">reduces governance risk</text>
  <rect x="128" y="995" width="463" height="121" rx="60" fill="#F5B82E"/>
  <text x="185" y="1073" font-size="42" font-weight="700" fill="#272839">Book a Demo</text>
  <g stroke="#272839" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <line x1="478" y1="1055" x2="534" y2="1055"/>
    <polyline points="515,1038 534,1055 515,1072"/>
  </g>
  <text x="138" y="1202" font-size="26" fill="#EDE7F2"><tspan font-weight="700">*Source:</tspan> NHS Resolution Annual Reports 2019/20 - 2024/25</text>
</svg>
